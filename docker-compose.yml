services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_planner
      POSTGRES_USER: studyplanner
      POSTGRES_PASSWORD: studyplanner
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyplanner -d study_planner"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://studyplanner:studyplanner@postgres:5432/study_planner
      JWT_SECRET: docker-local-secret
      NODE_ENV: production
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
